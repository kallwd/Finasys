[project]
name = "finasys"
version = "0.1.0"
description = "Finasys local-only Taiwan stock research and paper-trading system"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115.0",
    "finlab>=2.0.0,<3",
    "hmmlearn>=0.3.3,<0.4",
    "lightgbm>=4.6.0,<5",
    "scikit-learn>=1.7.0,<2",
    "uvicorn[standard]>=0.34.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.0",
    "pytest>=8.3.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
